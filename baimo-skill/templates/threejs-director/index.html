<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白模导演台</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script></head><body>
<header><strong>白模导演台</strong><input id="projectName" aria-label="项目名称" value="未命名白模"><select id="mode" aria-label="工作模式"><option value="scene">场景白模</option><option value="storyboard">分镜白模</option></select><button id="load">载入工程</button><button id="save">保存工程 JSON</button><button id="draft">恢复浏览器草稿</button><button id="undo">撤销</button><button id="redo">重做</button><span id="state">尚未修改</span></header>
<main><aside><h2>场景与人物</h2><div class="row"><button data-add="box">＋盒体</button><button data-add="cylinder">＋圆柱</button><button data-add="plane">＋地面</button><button data-add="person" id="addPerson">＋人物</button></div><select id="objects" size="7" aria-label="对象列表"></select><div class="row"><button id="copyObject">复制对象</button><button id="deleteObject">删除对象</button></div><label>名称<input id="objectName"></label><div id="transformFields"></div><label>基础姿态<select id="pose"><option value="standing">站立</option><option value="seated">坐姿</option><option value="crouching">蹲姿</option></select></label><div id="joints"></div><div class="row"><button data-tool="translate">移动</button><button data-tool="rotate">旋转</button><button data-tool="scale">缩放</button></div><p class="hint">地面为Y=0，人体朝本地+Z。旋转与关节输入为度。盒体坐标是中心，人物坐标是脚部基准。</p><h2>参考与辅助</h2><button id="reference">打开本地参考图</button><img id="refImage" alt="本地参考图" hidden><label><input type="checkbox" id="grid" checked>网格与相机辅助</label></aside>
<section id="stage"><div class="view-head"><span>全局观察｜左键环绕 · 右键平移 · 滚轮缩放</span><button id="resetObserve">恢复观察</button></div><div id="observe" class="view"></div><div class="view-head"><span>拍摄预览</span><button id="pilot">操作拍摄机：关闭</button><button id="fromObserve">观察视角 → 拍摄机</button></div><div id="preview" class="view"></div><div id="message" role="status">启动中…</div></section>
<aside><h2>拍摄摄影机</h2><div id="cameraFields"></div><label>画幅<select id="aspect"><option value="1.7777777777777777">16:9</option><option value="0.5625">9:16</option><option value="1">1:1</option><option value="2.3333333333333335">21:9</option><option value="custom">自定义</option></select></label><h2>分镜</h2><select id="shots" size="6" aria-label="镜头列表"></select><div class="row"><button id="newShot">新建镜头</button><button id="saveShot">保存当前镜头</button><button id="restoreShot">恢复当前镜头</button><button id="copyShot">复制镜头</button><button id="deleteShot">删除镜头</button></div><label>镜头名称<input id="shotName"></label><label>源镜号<input id="sourceShot"></label><label>源版本<input id="sourceVersion"></label><label>首帧<select id="frameType"><option value="normal">正常画面</option><option value="black">黑场</option></select></label><h2>输出</h2><label>图片宽度<input id="width" type="number" min="64" max="4096" value="1280"></label><button id="export">导出当前 PNG</button><button id="exportAll">导出已保存镜头 PNG</button><p class="hint">高度按画幅计算。批量下载可能需要浏览器允许多个文件。</p><h2>制作假设</h2><textarea id="assumptions" rows="4" placeholder="每行一项必要假设"></textarea></aside></main>
<input id="file" type="file" accept=".json,application/json" hidden><input id="imageFile" type="file" accept="image/*" hidden><script type="module" src="app.js"></script></body></html>
